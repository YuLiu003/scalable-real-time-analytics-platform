<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Portfolio Allocation</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #0b1220; color: #e5edf8; }
    body { margin: 0; padding: 3rem 1.25rem; }
    main { max-width: 900px; margin: auto; }
    h1 { margin-bottom: .3rem; }
    .muted { color: #9fb0c8; }
    .total { font-size: 2.4rem; font-weight: 700; margin: 2rem 0; color: #65d6ad; }
    table { width: 100%; border-collapse: collapse; background: #111c2e; border-radius: .7rem; overflow: hidden; }
    th, td { padding: .9rem 1rem; text-align: right; border-bottom: 1px solid #24344d; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #9fb0c8; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
    .error { color: #ff9a9a; }
  </style>
</head>
<body>
<main>
  <h1>Demo Portfolio Allocation</h1>
  <div id="meta" class="muted">Loading the latest deterministic snapshot…</div>
  <div id="total" class="total"></div>
  <div id="error" class="error" role="alert"></div>
  <table aria-label="Portfolio positions">
    <thead><tr><th>Instrument</th><th>Quantity</th><th>Price</th><th>Market value</th><th>Allocation</th></tr></thead>
    <tbody id="positions"></tbody>
  </table>
</main>
<script>
  const text = (value) => document.createTextNode(value);
  fetch('/api/v1/portfolios/demo/allocation', {cache: 'no-store'})
    .then((response) => { if (!response.ok) throw new Error(`result unavailable (${response.status})`); return response.json(); })
    .then((result) => {
      document.getElementById('meta').textContent = `As of ${result.as_of} · ${result.input_object_count} bronze objects`;
      document.getElementById('total').textContent = `${result.total_market_value} ${result.base_currency}`;
      const body = document.getElementById('positions');
      result.positions.forEach((position) => {
        const row = document.createElement('tr');
        [position.instrument, position.quantity, position.price, position.market_value, `${position.allocation_pct}%`]
          .forEach((value) => { const cell = document.createElement('td'); cell.appendChild(text(value)); row.appendChild(cell); });
        body.appendChild(row);
      });
    })
    .catch((error) => { document.getElementById('error').textContent = error.message; });
</script>
</body>
</html>
