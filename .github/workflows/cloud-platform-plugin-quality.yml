name: Cloud platform plugin quality

on:
  pull_request:
    paths:
      - '.github/workflows/cloud-platform-plugin-quality.yml'
      - 'tools/codex-plugins/cloud-platform-engineering/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-platform-plugin-quality.yml'
      - 'tools/codex-plugins/cloud-platform-engineering/**'

permissions:
  contents: read

concurrency:
  group: cloud-platform-plugin-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: plugin / metadata and 100% MCP coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/codex-plugins/cloud-platform-engineering/mcp/requirements-dev.txt

      - name: Install test dependencies
        run: >-
          python -m pip install
          --requirement tools/codex-plugins/cloud-platform-engineering/mcp/requirements-dev.txt

      - name: Validate plugin
        run: tools/codex-plugins/cloud-platform-engineering/scripts/quality.sh
