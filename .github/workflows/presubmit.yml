name: Presubmit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: presubmit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.12'
  PYTHON_VERSION: '3.13.14'

jobs:
  ps0:
    name: presubmit / PS0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run source, supply-chain, and PR policy checks
        env:
          PRESUBMIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PRESUBMIT_REQUIRE_PR_CHECKLIST: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci/presubmit.py PS0

  ps1:
    name: presubmit / PS1
    needs: ps0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/portfolio-analytics/requirements-dev.txt
            tools/codex-plugins/agent-review-optimizer/requirements-dev.txt
            tools/codex-plugins/cloud-platform-engineering/mcp/requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          python -m pip install --requirement services/portfolio-analytics/requirements-dev.txt
          python -m pip install --requirement tools/codex-plugins/agent-review-optimizer/requirements-dev.txt
          python -m pip install --requirement tools/codex-plugins/cloud-platform-engineering/mcp/requirements-dev.txt

      - name: Run correctness and coverage gates
        env:
          COVERAGE_DIR: ${{ runner.temp }}/portfolio-coverage
          PRESUBMIT_COVERAGE_FILE: ${{ runner.temp }}/presubmit.coverage
        run: python scripts/ci/presubmit.py PS1

  ps2:
    name: presubmit / PS2
    needs: ps1
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Install checksum-verified platform tools
        run: |
          scripts/ci/install-kubernetes-tools.sh "${RUNNER_TEMP}/portfolio-bin"
          scripts/ci/install-opentofu.sh "${RUNNER_TEMP}/portfolio-bin"
          printf '%s\n' "${RUNNER_TEMP}/portfolio-bin" >> "${GITHUB_PATH}"

      - name: Run disposable integration and infrastructure gates
        env:
          CI: 'true'
        run: python3 scripts/ci/presubmit.py PS2

      - name: Preserve scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kafka-scale-${{ github.run_id }}
          path: artifacts/kafka-scale
          if-no-files-found: warn
          retention-days: 14
