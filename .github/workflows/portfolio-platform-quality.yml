name: Portfolio Platform Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitignore'
      - '.github/workflows/aws-lab-plan.yml'
      - '.github/workflows/portfolio-platform-quality.yml'
      - 'README.md'
      - 'contracts/fixtures/demo-fund-portfolio.v2.json'
      - 'docs/features/cloud-native-investment-platform/**'
      - 'infra/opentofu/aws/**'
      - 'platform/gitops/**'
      - 'platform/local/**'
      - 'scripts/cloud/aws/**'
      - 'scripts/ci/**'
      - 'services/market-pipeline/**'
      - 'services/portfolio-analytics/**'
      - 'services/portfolio-api/**'
  push:
    branches:
      - main
      - 'feature/portfolio-analytics-*'
      - 'feature/aws-*'
    paths:
      - '.gitignore'
      - '.github/workflows/aws-lab-plan.yml'
      - '.github/workflows/portfolio-platform-quality.yml'
      - 'README.md'
      - 'contracts/fixtures/demo-fund-portfolio.v2.json'
      - 'docs/features/cloud-native-investment-platform/**'
      - 'infra/opentofu/aws/**'
      - 'platform/gitops/**'
      - 'platform/local/**'
      - 'scripts/cloud/aws/**'
      - 'scripts/ci/**'
      - 'services/market-pipeline/**'
      - 'services/portfolio-analytics/**'
      - 'services/portfolio-api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.12'
  PYTHON_VERSION: '3.13.14'

jobs:
  coverage:
    name: portfolio / 100% application coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/portfolio-analytics/requirements.txt
            services/portfolio-analytics/requirements-dev.txt

      - name: Install pinned analytics test dependencies
        working-directory: services/portfolio-analytics
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run the local-equivalent quality gate
        env:
          COVERAGE_DIR: ${{ runner.temp }}/portfolio-coverage
        run: make -C platform/local quality

      - name: Validate the GitHub Actions workflow
        run: |
          GOBIN="${RUNNER_TEMP}/portfolio-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "${RUNNER_TEMP}/portfolio-bin/actionlint" \
            .github/workflows/aws-lab-plan.yml \
            .github/workflows/portfolio-platform-quality.yml

      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/portfolio-coverage
          if-no-files-found: warn
          retention-days: 14

  container-build:
    name: portfolio / container build
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Build all feature images
        env:
          IMAGE_PREFIX: local
          IMAGE_TAG: ${{ github.sha }}
        run: scripts/ci/build-portfolio-images.sh

  aws-infrastructure:
    name: portfolio / aws infrastructure
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go for verified tool installation
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install verified Kubernetes and OpenTofu tools
        run: |
          scripts/ci/install-kubernetes-tools.sh "${RUNNER_TEMP}/portfolio-bin"
          scripts/ci/install-opentofu.sh "${RUNNER_TEMP}/portfolio-bin"
          printf '%s\n' "${RUNNER_TEMP}/portfolio-bin" >> "${GITHUB_PATH}"

      - name: Validate AWS infrastructure and desired state
        run: scripts/ci/validate-aws-platform.sh

  kind-e2e:
    name: portfolio / kind end-to-end
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Install verified Kubernetes tools
        run: |
          scripts/ci/install-kubernetes-tools.sh "${RUNNER_TEMP}/portfolio-bin"
          printf '%s\n' "${RUNNER_TEMP}/portfolio-bin" >> "${GITHUB_PATH}"

      - name: Render Kubernetes resources
        run: |
          kubectl kustomize platform/gitops/clusters/local >/dev/null
          kubectl kustomize platform/gitops/platform/local/market-data-services >/dev/null
          kubectl kustomize platform/gitops/apps/local/market-pipeline >/dev/null
          kubectl kustomize platform/gitops/apps/local/portfolio-analytics >/dev/null

      - name: Bootstrap and verify the complete platform
        run: |
          make -C platform/local bootstrap
          make -C platform/local bootstrap-data-path
          make -C platform/local bootstrap-analytics
          make -C platform/local verify-scale-lab

      - name: Preserve scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kafka-scale-${{ github.run_id }}
          path: artifacts/kafka-scale
          if-no-files-found: warn
          retention-days: 14

      - name: Collect failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/portfolio-diagnostics"
          TMPDIR="${RUNNER_TEMP}/portfolio-diagnostics" make -C platform/local diagnose-data-path || true
          TMPDIR="${RUNNER_TEMP}/portfolio-diagnostics" make -C platform/local diagnose-analytics || true
          kind export logs "${RUNNER_TEMP}/portfolio-diagnostics/kind" --name investment-platform || true

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-kind-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/portfolio-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Delete the ephemeral cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name investment-platform
          fi

  publish:
    name: portfolio / continuous delivery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [coverage, container-build, aws-infrastructure, kind-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/market-pipeline/go.sum
            services/portfolio-api/go.sum

      - name: Build immutable delivery images
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_PREFIX="${image_prefix}" scripts/ci/build-portfolio-images.sh

      - name: Publish commit and main tags to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          for image in portfolio-api portfolio-analytics market-pipeline; do
            docker tag "${image_prefix}/${image}:sha-${GITHUB_SHA}" "${image_prefix}/${image}:main"
            docker push "${image_prefix}/${image}:sha-${GITHUB_SHA}"
            docker push "${image_prefix}/${image}:main"
          done
