watchNamespace: analytics-apps

resources:
  operator:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  webhooks:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 5s
      additionalLabels:
        release: monitoring
