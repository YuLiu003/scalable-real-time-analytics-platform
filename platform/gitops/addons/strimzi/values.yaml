watchAnyNamespace: false

# Required when a Kafka resource places its User Operator watch in a namespace
# other than the Kafka resource's namespace.
extraEnvs:
  - name: STRIMZI_ENTITY_OPERATOR_WATCHED_NAMESPACE_ENABLED
    value: "true"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

generateNetworkPolicy: true
generatePodDisruptionBudget: false
