apiVersion: v1
kind: Service
metadata:
  name: garage-internal
  namespace: analytics-data
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: analytics-data
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: analytics-data
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  serviceName: garage-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: investment-analytics-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /garage
          args:
            - server
            - --single-node
            - --default-bucket
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage.toml
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: market-archive-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: market-archive-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: GARAGE_DEFAULT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: market-archive-credentials
                  key: S3_BUCKET
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: garage-server-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
