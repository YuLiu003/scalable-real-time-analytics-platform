apiVersion: v1
kind: Namespace
metadata:
  name: platform-observability
  labels:
    app.kubernetes.io/part-of: investment-analytics-platform
    platform.yuliu.dev/owner: platform
    platform.yuliu.dev/purpose: observability
    # Node exporter requires host namespaces, host ports, and read-only hostPath
    # mounts. Pod Security Admission exemptions are namespace-scoped, so keep
    # this exception in the dedicated platform namespace and retain restricted
    # audit/warn visibility below.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics-data
  labels:
    app.kubernetes.io/part-of: investment-analytics-platform
    platform.yuliu.dev/owner: data-platform
    platform.yuliu.dev/purpose: stateful-data-services
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics-apps
  labels:
    app.kubernetes.io/part-of: investment-analytics-platform
    platform.yuliu.dev/owner: application
    platform.yuliu.dev/purpose: stateless-workloads
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
