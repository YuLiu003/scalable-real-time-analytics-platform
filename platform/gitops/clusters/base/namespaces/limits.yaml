apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-resources
  namespace: platform-observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-resources
  namespace: analytics-data
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-resources
  namespace: analytics-apps
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
