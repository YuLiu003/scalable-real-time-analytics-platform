apiVersion: v1
kind: ResourceQuota
metadata:
  name: local-data-budget
  namespace: analytics-data
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "20"
    pods: "30"
    services: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: local-application-budget
  namespace: analytics-apps
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    pods: "40"
    services: "20"
    configmaps: "50"
    secrets: "50"
