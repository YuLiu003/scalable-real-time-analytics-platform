apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale-load-producer
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: scale-load-producer
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale-event-archiver
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: scale-event-archiver
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
automountServiceAccountToken: false
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: scale-load-producer
  namespace: analytics-apps
  labels:
    strimzi.io/cluster: market-kafka
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: market.prices.scale
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - IdempotentWrite
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: scale-event-archiver
  namespace: analytics-apps
  labels:
    strimzi.io/cluster: market-kafka
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: market.prices.scale
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: ingestion.quarantine
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: group
          name: scale-event-archiver
          patternType: prefix
        operations:
          - Describe
          - Read
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - IdempotentWrite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-event-archiver
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: scale-event-archiver
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scale-event-archiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-event-archiver
        app.kubernetes.io/component: scale-lab
        app.kubernetes.io/part-of: investment-analytics-platform
    spec:
      serviceAccountName: scale-event-archiver
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archiver
          image: local/market-pipeline:slice5
          imagePullPolicy: Never
          command:
            - /raw-event-archiver
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: market-archive-credentials
          env:
            - name: KAFKA_BROKERS
              value: market-kafka-kafka-bootstrap.analytics-data.svc.cluster.local:9093
            - name: KAFKA_TOPIC
              value: market.prices.scale
            - name: KAFKA_QUARANTINE_TOPIC
              value: ingestion.quarantine
            - name: KAFKA_CONSUMER_GROUP
              value: scale-event-archiver-v1
            - name: KAFKA_TLS_CA_FILE
              value: /etc/kafka-cluster-ca/ca.crt
            - name: KAFKA_TLS_CERT_FILE
              value: /etc/kafka/user.crt
            - name: KAFKA_TLS_KEY_FILE
              value: /etc/kafka/user.key
            - name: ARCHIVER_METRICS_SCOPE
              value: scale
            - name: ARCHIVER_LOG_EVERY
              value: "100"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kafka-user
              mountPath: /etc/kafka
              readOnly: true
            - name: kafka-cluster-ca
              mountPath: /etc/kafka-cluster-ca
              readOnly: true
      volumes:
        - name: kafka-user
          secret:
            secretName: scale-event-archiver
        - name: kafka-cluster-ca
          configMap:
            name: market-kafka-cluster-ca
---
apiVersion: v1
kind: Service
metadata:
  name: scale-event-archiver
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: scale-event-archiver
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  selector:
    app.kubernetes.io/name: scale-event-archiver
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-load-producer
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: scale-load-producer
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scale-load-producer
            app.kubernetes.io/component: scale-lab
            app.kubernetes.io/part-of: investment-analytics-platform
        spec:
          serviceAccountName: scale-load-producer
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: producer
              image: local/market-pipeline:slice5
              imagePullPolicy: Never
              command:
                - /synthetic-producer
              env:
                - name: PRODUCER_SCENARIO
                  value: load
                - name: LOAD_RUN_ID
                  value: local-scale
                - name: LOAD_PHASE
                  value: original
                - name: LOAD_EVENT_COUNT
                  value: "1200"
                - name: LOAD_INSTRUMENTS
                  value: LOAD-A,LOAD-B,LOAD-C,LOAD-D,LOAD-E,LOAD-F,LOAD-G,LOAD-H,LOAD-I,LOAD-J,LOAD-K,LOAD-L
                - name: LOAD_BASE_TIME
                  value: "2026-07-30T00:00:00Z"
                - name: LOAD_TARGET_RATE
                  value: "0"
                - name: KAFKA_BROKERS
                  value: market-kafka-kafka-bootstrap.analytics-data.svc.cluster.local:9093
                - name: KAFKA_TOPIC
                  value: market.prices.scale
                - name: KAFKA_TLS_CA_FILE
                  value: /etc/kafka-cluster-ca/ca.crt
                - name: KAFKA_TLS_CERT_FILE
                  value: /etc/kafka/user.crt
                - name: KAFKA_TLS_KEY_FILE
                  value: /etc/kafka/user.key
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: kafka-user
                  mountPath: /etc/kafka
                  readOnly: true
                - name: kafka-cluster-ca
                  mountPath: /etc/kafka-cluster-ca
                  readOnly: true
          volumes:
            - name: kafka-user
              secret:
                secretName: scale-load-producer
            - name: kafka-cluster-ca
              configMap:
                name: market-kafka-cluster-ca
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: market-archivers
  namespace: analytics-apps
  labels:
    release: monitoring
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  namespaceSelector:
    matchNames:
      - analytics-apps
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - raw-event-archiver
          - scale-event-archiver
  endpoints:
    - port: metrics
      interval: 5s
      scrapeTimeout: 3s
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: scale-event-archiver-kafka
  namespace: analytics-apps
  labels:
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  secretTargetRef:
    - parameter: cert
      name: scale-event-archiver
      key: user.crt
    - parameter: key
      name: scale-event-archiver
      key: user.key
  configMapTargetRef:
    - parameter: ca
      name: market-kafka-cluster-ca
      key: ca.crt
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scale-event-archiver
  namespace: analytics-apps
  labels:
    app.kubernetes.io/component: scale-lab
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  scaleTargetRef:
    name: scale-event-archiver
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 5
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: kafka
      name: market-prices-scale-lag
      metadata:
        bootstrapServers: market-kafka-kafka-bootstrap.analytics-data.svc.cluster.local:9093
        consumerGroup: scale-event-archiver-v1
        topic: market.prices.scale
        lagThreshold: "25"
        offsetResetPolicy: earliest
        allowIdleConsumers: "false"
        limitToPartitionsWithLag: "true"
        scaleToZeroOnInvalidOffset: "false"
        tls: enable
      authenticationRef:
        name: scale-event-archiver-kafka
