apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpaca-market-feed
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
automountServiceAccountToken: false
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: alpaca-market-producer
  namespace: analytics-apps
  labels:
    strimzi.io/cluster: market-kafka
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: market.prices
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - IdempotentWrite
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpaca-market-feed-state
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpaca-market-feed
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alpaca-market-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alpaca-market-feed
        app.kubernetes.io/part-of: investment-analytics-platform
    spec:
      serviceAccountName: alpaca-market-feed
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market-feed
          image: local/market-pipeline:slice5
          imagePullPolicy: Never
          command:
            - /alpaca-market-producer
          ports:
            - name: metrics
              containerPort: 8082
              protocol: TCP
          env:
            - name: KAFKA_BROKERS
              value: market-kafka-kafka-bootstrap.analytics-data.svc.cluster.local:9093
            - name: KAFKA_TOPIC
              value: market.prices
            - name: KAFKA_TLS_CA_FILE
              value: /etc/kafka-cluster-ca/ca.crt
            - name: KAFKA_TLS_CERT_FILE
              value: /etc/kafka/user.crt
            - name: KAFKA_TLS_KEY_FILE
              value: /etc/kafka/user.key
            - name: ALPACA_STREAM_URL
              value: wss://stream.data.alpaca.markets/v2/iex
            - name: ALPACA_HISTORY_URL
              value: https://data.alpaca.markets/v2/stocks/bars
            - name: ALPACA_FEED
              value: iex
            - name: ALPACA_SOURCE
              value: alpaca-iex
            - name: ALPACA_CHECKPOINT_FILE
              value: /state/checkpoint.json
            - name: HTTP_ADDRESS
              value: ":8082"
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: alpaca-market-feed
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alpaca-market-feed
                  key: APCA_API_SECRET_KEY
            - name: MARKET_WATCHLIST
              valueFrom:
                secretKeyRef:
                  name: alpaca-market-feed
                  key: MARKET_WATCHLIST
            - name: MARKET_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: alpaca-market-feed
                  key: MARKET_TENANT_ID
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kafka-user
              mountPath: /etc/kafka
              readOnly: true
            - name: kafka-cluster-ca
              mountPath: /etc/kafka-cluster-ca
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: kafka-user
          secret:
            secretName: alpaca-market-producer
        - name: kafka-cluster-ca
          configMap:
            name: market-kafka-cluster-ca
        - name: state
          persistentVolumeClaim:
            claimName: alpaca-market-feed-state
---
apiVersion: v1
kind: Service
metadata:
  name: alpaca-market-feed
  namespace: analytics-apps
  labels:
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  selector:
    app.kubernetes.io/name: alpaca-market-feed
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alpaca-market-feed
  namespace: analytics-apps
  labels:
    release: monitoring
    app.kubernetes.io/name: alpaca-market-feed
    app.kubernetes.io/part-of: investment-analytics-platform
spec:
  namespaceSelector:
    matchNames:
      - analytics-apps
  selector:
    matchLabels:
      app.kubernetes.io/name: alpaca-market-feed
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
