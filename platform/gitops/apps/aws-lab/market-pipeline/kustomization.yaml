apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/market-pipeline
  - access-denied-probe.yaml
  - portfolio-fixtures.yaml
  - runtime-config.yaml

images:
  - name: local/market-pipeline
    newName: ECR_REGISTRY_PLACEHOLDER/investment-analytics/market-pipeline
    newTag: IMAGE_TAG_PLACEHOLDER

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: raw-event-archiver
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/envFrom
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: aws-runtime
