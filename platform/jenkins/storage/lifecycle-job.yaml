apiVersion: batch/v1
kind: Job
metadata:
  name: configure-jenkins-artifact-lifecycle
  namespace: jenkins-system
  labels:
    app.kubernetes.io/name: jenkins-artifact-lifecycle
    app.kubernetes.io/part-of: investment-platform-jenkins
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-artifact-lifecycle
        app.kubernetes.io/part-of: investment-platform-jenkins
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: configure
          image: local/jenkins-presubmit-agent:0.1.0
          imagePullPolicy: Never
          command:
            - python3
            - /opt/jenkins-storage/configure-artifact-lifecycle.py
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: jenkins-artifact-admin
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jenkins-artifact-admin
                  key: secret-key
            - name: S3_ENDPOINT
              value: http://jenkins-artifacts.jenkins-system.svc.cluster.local:3900
            - name: S3_BUCKET
              value: jenkins-artifacts
            - name: S3_RETENTION_DAYS
              value: "3"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: lifecycle-script
              mountPath: /opt/jenkins-storage
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lifecycle-script
          configMap:
            name: jenkins-artifact-lifecycle
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
