kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jenkins-platform
networking:
  apiServerAddress: 127.0.0.1
  podSubnet: 10.250.0.0/16
  serviceSubnet: 10.251.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        apiVersion: kubeadm.k8s.io/v1beta3
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "platform.local/role=jenkins-control"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        apiVersion: kubeadm.k8s.io/v1beta3
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "platform.local/role=jenkins-workload"
