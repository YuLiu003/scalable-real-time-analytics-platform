# Resource-bounded values for a disposable local learning cluster.
# Persistent monitoring storage and Alertmanager are deferred until the
# reliability milestone defines retention, backup, and alert-routing behavior.
alertmanager:
  enabled: false

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  persistence:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Match the kubelet's ten-second cAdvisor housekeeping interval. Capacity
# trials use a twenty-five-second CPU rate window so scrape jitter still leaves
# at least two raw, source-timestamped samples inside the trial boundary.
kubelet:
  serviceMonitor:
    cAdvisorInterval: 10s

# These control-plane endpoints are not exposed in a default kind cluster.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
